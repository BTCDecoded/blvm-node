[package]
name = "blvm-storage-fence"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The only crate that depends on heed3, redb, sled, and rocksdb."

[dependencies]
sled = { version = "=0.34.7", optional = true }
redb = { version = "=1.4", optional = true }
rocksdb = { version = "=0.24.0", optional = true }
heed3 = { version = "=0.22.1", optional = true, default-features = false }

[features]
default = []
sled = ["dep:sled"]
redb = ["dep:redb"]
rocksdb = ["dep:rocksdb"]
heed3 = ["dep:heed3"]
