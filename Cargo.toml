[package]
name = "blvm-node"
version = "0.1.92"
edition = "2024"
authors = ["Bitcoin Commons Team"]
description = "Bitcoin Commons BLVM: Minimal Bitcoin node implementation using blvm-protocol and blvm-consensus"
license = "MIT"
repository = "https://github.com/BTCDecoded/blvm-node"
homepage = "https://btcdecoded.org"
documentation = "https://docs.rs/blvm-node"
keywords = ["bitcoin", "node", "blockchain", "cryptocurrency", "p2p"]
categories = ["cryptography::cryptocurrencies", "network-programming"]
rust-version = "1.91"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("governance", "erlay", "rayon", "wasm-modules", "ibd-dev", "spec-lock", "timer-cron"))'] }
# Integration tests (`tests/*.rs`) intentionally exercise APIs without always consuming every binding.
unused_variables = "allow"
unused_comparisons = "allow"
unused_doc_comments = "allow"

# Integration-test ergonomics (CI runs `cargo clippy --tests -- -D warnings`).
[lints.clippy]
assertions_on_constants = "allow"
too_many_arguments = "allow"
single_match = "allow"
field_reassign_with_default = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Protocol / consensus from crates.io (monorepo: checkout siblings for local iteration).
blvm-protocol = { version = ">=0.1, <1" }
blvm-consensus = { version = ">=0.1, <1", optional = true }
# crates.io releases use 0.1 semver; sibling [patch.crates-io] path for monorepo work.
# Node requires current MuHash APIs (running-state serde, insert_mut/remove_mut hot path).
blvm-muhash = { version = ">=0.1, <1" }

# Storage engines (heed3, redb, sled, rocksdb) are dependencies of blvm-storage-fence.
blvm-storage-fence = { version = "0.1.0", path = "crates/blvm-storage-fence", default-features = false }
# Pure-Rust LevelDB reader: used when Bitcoin Core chainstate has .ldb (true LevelDB) files
# that RocksDB cannot open. Gated behind the rocksdb feature (migration requires rocksdb dest).
rusty-leveldb = { version = "4", optional = true }
# Git-pinned deps: used only where upstream has not cut a crates.io release containing
# the API we need. All are pinned to an exact rev or tag to guarantee reproducibility.
# Policy: upgrade to crates.io as soon as a compatible release ships; never leave
# a git dep on a floating branch. Packagers who disallow git deps should disable the
# relevant feature.
#
# rkyv: zero-copy archived values paired with heed3 mmap reads.
rkyv = { version = "=0.8.18", optional = true, features = ["bytecheck"] }

# Networking layer - EXACT VERSIONS for security
# Explicit features avoid `full` (smaller graphs, clearer deps). Mirrors actual `tokio::` usage
# (`rt-multi-thread`, `sync`, `time`, `net`, `fs`, `process`, `io-util`, `signal`, test macros).
tokio = { version = "=1.54.1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "io-util",
    "fs",
    "process",
    "signal",
] }
tokio-util = { version = "=0.7.17", features = ["codec", "io"] }  # Updated for iroh 0.95 compatibility (requires ^0.7.14)
futures = "=0.3.31"  # Updated for iroh 0.95 compatibility (requires ^0.3.31)
# HTTP server - EXACT VERSIONS for security
http = "=1.1.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.8.0", features = ["server", "http1", "http2"] }  # Updated for iroh 0.95 compatibility (hyper-util 0.1.18 requires ^1.8.0)
hyper-util = { version = "=0.1.18", features = ["server", "http1", "tokio"] }  # Updated for iroh 0.95 compatibility (requires ^0.1.11)

# Serialization - EXACT VERSIONS for security
serde = { version = "=1.0.228", features = ["derive", "rc"] }  # Updated for iroh 0.95 compatibility (requires ^1.0.219)
serde_json = "=1.0.133"
serde_bytes = "=0.11.19"  # Updated for iroh 0.95 compatibility (requires ^0.11.17)
bincode = "=1.3.3"
bytes = "=1.11.1"  # RUSTSEC-2026-0007: Integer overflow in BytesMut::reserve (was 1.10.1)
toml = "=0.8.2"

# Pure-Rust secp256k1 (same implementation as blvm-consensus/blvm-protocol)
blvm-secp256k1 = { version = ">=0.1, <1" }
sha2 = "=0.10.9"
# UTC cron schedules. Off unless the timer-cron feature is enabled.
cron = { version = "=0.17.0", optional = true }
chrono = { version = "=0.4.45", optional = true, default-features = false }
argon2 = "=0.5.3"
ripemd = "=0.1.3"
hex = "=0.4.3"
siphasher = "=0.3"
# bindgen (via librocksdb-sys) requires rustc-hash ^2.1; pin must match lockfile/resolver.
rustc-hash = "=2.1.1"  # FxHashMap/FxHashSet for disk_utxo hot path (2-3× faster than SipHash)
zeroize = { version = "=1.9.1", features = ["zeroize_derive"] }  # iroh-base 1.4.1 requires ^1.9

# Network utilities — local IP detection is stdlib-only (UDP socket trick in lan_discovery.rs)
constant_time_eq = "=0.3"  # Constant-time comparison for token authentication
# RUSTSEC-2026-0009: iroh/rcgen transitive; force >=0.3.47 (crates.io ships 0.3.47+).
time = { version = ">=0.3.47", default-features = false }
# iroh 1.4 uses stable ed25519-dalek 3.0.0 and pkcs8 0.11.0.
# The 0.95-era rc.4 / rc.11 pins do not resolve next to that dalek.
aes-gcm = "=0.10.3"  # Module encryption
hkdf = "=0.12.4"  # Key derivation for module encryption

# Random number generation for Dandelion++
rand = "=0.8.5"
# Directory utilities for Bitcoin Core detection
dirs = "=5.0"
# SmallVec: required because blvm-protocol's Transaction always uses SmallVec regardless
# of feature flags in published versions.  The production feature previously made this
# optional but that's incompatible with the published blvm-protocol API.
smallvec = { version = "=1.15.1", features = ["serde", "const_generics"] }

# Multi-consumer channel for prefetch workers and ibd_engine Compacter
crossbeam-channel = "=0.5"
# Lower-contention mutex for IBD feeder buffer (validation + feeder hot path) and ibd_engine snapshot pattern
parking_lot = "=0.12"
# Parallel query in ibd_engine MemoryRun and SpendSession key sorting (optional, enabled via `rayon` feature)
rayon = { version = "1", optional = true }

# Address encoding (BIP173/350/351) is handled by blvm-protocol (bech32 dep lives there).
# Legacy P2PKH/P2SH (Base58Check) decoded inline in rpc/rawtx.rs using sha2.

# Error handling - EXACT VERSIONS for security
anyhow = "=1.0.104"
thiserror = "=1.0.69"

# Logging - EXACT VERSIONS for security
tracing = "=0.1.44"  # iroh-metrics 1.0.2 requires ^0.1.44
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }

# CLI - EXACT VERSIONS for security
clap = { version = "=4.4.11", features = ["derive"] }

# Async traits - for transport abstraction
async-trait = "=0.1.75"

# Bitflags for transport preference combinations
bitflags = "^2.6"

# lru: always a direct dep so serialization_cache.rs can import it without the
# production feature gate (blvm_protocol::lru is only exposed with production).
lru = "=0.18.5"

# Concurrent HashMap for IBD v2 (zero lock contention); works on all platforms
dashmap = "=6.0"

# Memory / HTTP helpers: must live in top-level [dependencies] so Windows builds
# resolve them when default features enable `sysinfo` / `governance` (they are not Unix-only).
sysinfo = { version = "=0.30", optional = true }
# rustls 0.23 is already in Cargo.lock through the QUIC stack (iroh/quinn).
# Governance uses Client::builder, timeout, user-agent, Authorization, get, and status.
# It does not use OpenSSL. `socks` is the broker's socks5h proxy.
reqwest = { version = "=0.12", optional = true, default-features = false, features = ["json", "rustls-tls", "socks"] }

# Cross-platform optional deps (top-level so Windows release builds match Linux defaults).
zstd = { version = "=0.14", optional = true }
notify = { version = "=6.1", optional = true }
iroh = { version = "=1.0.0", optional = true }
quinn = { version = "=0.11", optional = true }
rcgen = { version = "=0.12", optional = true }
rustls = { version = "=0.23", optional = true }
h3 = { version = "=0.0.8", optional = true }
h3-quinn = { version = "=0.0.10", optional = true }

# Memory allocator optimization
# Disabled for Windows cross-compilation (mimalloc linking issues with MinGW)
[target.'cfg(target_os = "linux")'.dependencies]
# IBD engine batch reads (table.rs); code is cfg(linux) with pread64 fallback elsewhere.
io-uring = "0.7"

[target.'cfg(not(target_os = "windows"))'.dependencies]
mimalloc = { version = "=0.1", default-features = false, optional = true }
libmimalloc-sys = { version = "=0.1", features = ["extended"], optional = true }
# jemalloc: background purge threads return cross-thread freed pages to OS automatically.
# Better than mimalloc v3 for IBD: handles the download-thread→validator cross-thread
# free pattern (Arc<Block> allocated by download, freed by validator) without accumulating
# abandoned pages. Set MALLOC_CONF=background_thread:true,dirty_decay_ms:500.
tikv-jemallocator = { version = "0.5", features = ["background_threads", "profiling"], optional = true }

# System calls for process sandboxing (Unix)
nix = { version = "=0.28", features = ["process", "resource"], optional = true }
libc = { version = "=0.2", optional = true }

# Windows Job Objects for process sandboxing (Windows)
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

# Iroh 1.0.0. Its hickory-proto is 0.26.3, which clears the 0.25 advisories
# (RUSTSEC-2026-0118, 0119, and 0487 through 0514). Requires Rust 1.91.
# Advisory suppressions for CI: **only** `.cargo/audit.toml`.

[features]
# Storage: `database_backend = "auto"` picks heed3 when the `heed3` feature is enabled
# (see `storage/database/mod.rs::default_backend`). Redb, sled, and rocksdb stay optional.
default = [
    "sysinfo",
    "heed3",
    "libc",
    "production",
    "governance",
    "module-http",
    "utxo-commitments",
    "protocol-verification",
    "iroh",
    "dandelion",
    "sigop",
    "rest-api",
]
# Audit-surface subset. Not part of `default`. Excludes the module loader,
# iroh, governance, utxo-commitments, dandelion, rest-api, and sigop.
minimal = [
    "sysinfo",
    "heed3",
    "libc",
    "production",
    "protocol-verification",
]
# Note: rocksdb and erlay are mutually exclusive due to clang-sys version conflicts
iroh = ["dep:iroh"]
quinn = ["dep:quinn", "dep:rcgen", "dep:rustls", "dep:h3", "dep:h3-quinn"]
utxo-commitments = ["blvm-protocol/utxo-commitments"]
stratum-v2 = []
# Signature operations counting
sigop = []
# System information for memory stats (sysinfo is always included)
sysinfo = ["dep:sysinfo"]
# Storage backends
sled = ["blvm-storage-fence/sled"]
redb = ["blvm-storage-fence/redb"]
# Note: rocksdb and erlay are mutually exclusive due to clang-sys version conflicts
rocksdb = ["blvm-storage-fence/rocksdb", "dep:rusty-leveldb"]
heed3 = ["blvm-storage-fence/heed3", "dep:rkyv"]
# Process sandboxing (Unix)
nix = ["dep:nix", "dep:libc"]
libc = ["dep:libc"]
# Rayon parallel iterators (enabled by production).
# `dep:rayon` is the actual crate; `rayon = []` enables parallel paths in blvm-consensus.
rayon = ["dep:rayon"]
# Production optimizations (parallel block validation, etc.)
production = ["blvm-protocol/production", "dep:blvm-consensus", "rayon", "jemalloc"]
# Profiling: IBD_PROFILE, PERF, BATCH logs. NOT for production.
profile = ["blvm-protocol/profile", "dep:blvm-consensus"]
# Lab / rematch only: synthetic WAN harness + destructive IBD examples.
# Not in default. Rematch: `cargo build -p blvm --features ibd-dev`.
ibd-dev = []
# Privacy relay (Dandelion++); enabled in default release builds.
dandelion = ["blvm-protocol/dandelion"]
# Protocol (10.1) and handshake (10.2) markers. Does not depend on blvm-spec-lock.
protocol-verification = ["blvm-protocol/protocol-verification"]
# CTV (BIP119 CheckTemplateVerify) - passed through from blvm-protocol
ctv = ["blvm-protocol/ctv", "dep:blvm-consensus"]
# v2 encrypted transport. Off unless this feature is enabled. The offer flag stays false.
bip324 = ["blvm-protocol/bip324"]
# Governance (auto-detect Commons server, HTTP client)
governance = ["dep:reqwest"]
# Module outbound HTTP broker (design 19.2). Same reqwest build as governance.
module-http = ["dep:reqwest"]
# Memory allocator optimization (mimalloc) - faster than default allocator
# Disabled for Windows cross-compilation (mimalloc linking issues with MinGW)
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
# jemalloc: preferred for IBD; background purge threads handle cross-thread freed pages.
# Build with: --features jemalloc (and without --features mimalloc).
jemalloc = ["dep:tikv-jemallocator"]
# JSON logging format for structured logging (production/monitoring).
# Off the default build. `init_json_logging` calls `fmt::layer().json()`.
json-logging = ["tracing-subscriber/json"]
# Modern REST API (runs alongside JSON-RPC)
rest-api = []
# HTTP BIP70 payment protocol support (requires rest-api)
bip70-http = ["rest-api"]
# Module file watcher for hot-reload on module.toml/config.toml change
module-watcher = ["dep:notify"]
# Wall-clock cron expressions for module timers. Not in the default build.
timer-cron = ["dep:cron", "dep:chrono"]
# WASM module support (load .wasm modules in-process, hotloading)
wasm-modules = []
# miniscript feature removed — see blvm-miniscript module
# Coverage-suite integration tests (tarpaulin / local gates only; skipped in default CI).
coverage-tests = []

# Storage compression optimizations
block-compression = ["dep:zstd"]
utxo-compression = ["dep:zstd"]
witness-compression = ["dep:zstd"]
# All compression features
compression = ["block-compression", "utxo-compression", "witness-compression"]

# Erlay (BIP330) transaction relay optimization
# Note: Requires libclang/LLVM for minisketch-rs bindgen compilation
# Erlay is entirely optional - if libclang is not available, simply don't enable this feature
# For CI without libclang: omit the erlay feature entirely
# DISABLED: erlay conflicts with rocksdb due to clang-sys version conflicts
# To enable erlay, uncomment minisketch-rs dependency above and this feature
# erlay = ["dep:minisketch-rs"]


# Local monorepo: sibling paths override the blvm-* version pins above.
# The optional quinn feature still resolves quinn-proto 0.11.15. 0.11.19
# (RUSTSEC-2026-0338 through 0342) does not resolve next to quinn 0.11.
[patch.crates-io]
blvm-protocol = { path = "../blvm-protocol" }
blvm-consensus = { path = "../blvm-consensus" }
blvm-primitives = { path = "../blvm-primitives" }
blvm-secp256k1 = { path = "../blvm-secp256k1" }
blvm-muhash = { path = "../blvm-muhash" }

[dev-dependencies]
blvm-protocol = { version = ">=0.1, <1", features = ["test-utils"] }
blvm-consensus = { version = ">=0.1, <1", features = ["test-utils"] }
tempfile = "=3.8.1"
rand = "0.8"
# For iroh SecretKey generation in iroh-gated tests (avoids RNG version conflicts)
getrandom = "=0.2.17"
# Module DB / WASM integration tests that used blvm_sdk live under tests/module/ — run them from a
# monorepo checkout with a path dev-dependency, or from blvm-sdk; not required for CI/crates.io.
criterion = "=0.5.1"
proptest = "=1.5.0"
dhat = "=0.3"  # Heap profiling
serial_test = "=3.0"  # Sequential test execution for database isolation
# Paused/advanced tokio clock for deterministic rate-limiter tests (same version as the main dep)
tokio = { version = "=1.54.1", features = ["test-util"] }

# Release profile optimizations (mirrors blvm-consensus)
[profile.release]
# Production optimizations (mirrors blvm-consensus)
opt-level = 3
lto = false        # off: fastest iteration; use thin/fat for production/CI
codegen-units = 256  # max parallelism
strip = true  # Remove symbols for smaller binaries
panic = "abort"  # Smaller binaries, no unwinding overhead

[profile.release.package."*"]
opt-level = 3

# Fast release: opt-level 2 for iteration (~2-3x faster compile)
[profile.release-fast]
inherits = "release"
opt-level = 2

[profile.release-fast.package."*"]
opt-level = 2

# Benchmark profile
[profile.bench]
opt-level = 3
debug = false
strip = false
lto = "thin"
codegen-units = 16

# Benchmark targets
# Benchmarks have been moved to blvm-bench crate
# See: https://github.com/BTCDecoded/blvm-bench

# Local development: use .cargo/config.toml or [patch.crates-io] in this file to point at sibling repos.

# IMPORTANT: rocksdb and erlay features are mutually exclusive
# Due to clang-sys version conflicts, you cannot enable both features simultaneously.
# To use rocksdb, you must exclude erlay from your build:
#   cargo build --features rocksdb --no-default-features
# Then manually add back other needed features (e.g., --features rocksdb,production)
# The build script (build.rs) will catch this conflict at build time.


