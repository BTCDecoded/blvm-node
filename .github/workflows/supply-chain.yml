name: Supply chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: [self-hosted, Linux, X64, builds]
    steps:
      - uses: actions/checkout@v6

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      # Pinned for the self-hosted runner's rustc 1.91: cargo-deny 0.22.0 needs 1.95.
      # 0.21.0 is the newest release with MSRV <= 1.91 (1.89). Drop the pin when the
      # runner toolchain is bumped.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.21.0 --locked

      - name: cargo deny
        run: cargo deny check

  semver:
    name: cargo-semver-checks
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64, builds]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Strip [patch.crates-io] for crates.io-only CI
        uses: BTCDecoded/rust-ci/strip-patch-crates-io@main

      - name: Install Rust
        uses: BTCDecoded/rust-ci/install-rust-toolchain@main

      # Pinned for the self-hosted runner's rustc 1.91: cargo-semver-checks 0.50.0+
      # needs 1.93. 0.49.0 is the newest release with MSRV <= 1.91 (1.91). Drop the
      # pin when the runner toolchain is bumped.
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --version 0.49.0 --locked

      - name: API breaks require a version bump
        run: cargo semver-checks --baseline-rev origin/${{ github.base_ref }}
