# cargo-deny policy for the blvm binary.
# Vulnerability IDs match .cargo/audit.toml. Duplicate versions warn: the iroh 0.95
# and quinn-proto pins cannot unify, and a deny would fail every pull request
# before that upgrade exists. See docs/stability/PROGRESS.md.

[advisories]
# cargo-deny 0.16 removed the vulnerability lint. Vulnerabilities still deny
# unless they are in ignore. 0.18 made unmaintained a scope: none, workspace,
# transitive, or all. The previous value was "warn", which this schema cannot
# express. "none" is the scope that does not fail the build.
unmaintained = "none"
yanked = "warn"
ignore = [
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    "RUSTSEC-2026-0338",
    "RUSTSEC-2026-0339",
    "RUSTSEC-2026-0340",
    "RUSTSEC-2026-0341",
    "RUSTSEC-2026-0342",
    "RUSTSEC-2026-0379",
    "RUSTSEC-2026-0380",
    "RUSTSEC-2026-0424",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    "Unlicense",
    "BSL-1.0",
    "MIT-0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
